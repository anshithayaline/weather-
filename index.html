<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my weather app homepage</title>

    <link rel="stylesheet" href="style.css">      

    

</head>
<body>

    <h1>WEATHER REPORT</h1>
    <div class="dashboard">
        <div class="weather-card">
            <h2>Chennai, India</h2>
            <p>Today.11 Oct 2026</p>
            <div class="weather-icon">🌤️</div>
            <h1>31°C</h1>
            <p>Partly Cloudy</p>
            <div class="details"></div>
              <div><small>HUMIDITY</small><b>78%</b></div>
            <div><small>WIND</small><b>12km/h</b></div>
            <div><small>FEELS LIKE</small><b>34°C</b></div>
              
        </div>
    </div>

    <div class="weekly-forecast">
        <h3>Weekly forecast</h3>
        <div class="days">
            <div class="day active">
                <p>Mon</p>
                <p>🌤️</p>
                <span>31°</span>
            </div>

            <div class="day">
                <p>Tue</p>
                <p>🌧️</p>
                <span>29°</span>
            </div>

            <div class="day">
                <p>Wed</p>
                <p>☀️</p>
                <span>32°</span>
            </div>

            <div class="day">
                <p>Thu</p>
                <p>🌤️</p>
                <span>30°</span>
            </div>

            <div class="day">
                <p>Fri</p>
                <p>🌤️</p>
                <span>28°</span>
            </div>

            <div class="day">
                <p>sat</p>
                <p>🌤️</p>
                <span>30°</span>
            </div>

            <div class="day">
                <p>sun</p>
                <p>🌤️</p>
                <span>36°</span>
            </div>


        </div>

    </div>
</body>
</html>
